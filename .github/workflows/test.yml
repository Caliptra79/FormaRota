name: FormaRota tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all regression tests
        run: node --test tests/*.test.cjs
      - name: Validate Windows offline bundle
        run: node desktop/build-assets.cjs && node --test desktop/desktop.test.cjs
